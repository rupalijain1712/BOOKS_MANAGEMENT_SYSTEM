{% extends 'base.html' %}

{% block content %}

<h2>
    Order #{{ order.id }}
</h2>

<hr>

<table class="table table-bordered">

    <tr>
        <th>Book</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>

    {% for item in items %}

    <tr>

        <td>
            {{ item.title }}
        </td>

        <td>
            {{ item.quantity }}
        </td>

        <td>
            ₹ {{ item.price }}
        </td>

    </tr>

    {% endfor %}

</table>

<h4>
    Total Amount:
    ₹ {{ order.total_amount }}
</h4>

{% endblock %}
