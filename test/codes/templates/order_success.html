{% extends 'base.html' %}

{% block content %}

<div class="text-center">

    <h1>
        Order Placed Successfully 🎉
    </h1>

    <br>

    <h4>
        Order ID:
        #{{ order.id }}

        Continue Shopping
    </a>

</div>

{% endblock %}
