{% extends "base.html" %}

{% block content %}

<h2>User Management</h2>

<hr>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Password</th>
    </tr>

    {% for user in users %}

    <tr>

        <td>{{ user.id }}</td>

        <td>{{ user.username }}</td>

        <td>{{ user.email }}</td>

        <td>{{ user.role }}</td>

        <td>{{ user.password }}</td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
