{% extends 'base.html' %}

{% block content %}

<h2>Add New Book</h2>

<form method="POST">

    <div class="mb-3">

        <label>Book Name</label>

        <input
        type="text"
        name="book_name"
        class="form-control"
        placeholder="e.g. Atomic Habits">

    </div>
    <div class="mb-3">

        <label>Category</label>

        <input
        type="text"
        name="category"
        class="form-control"
        placeholder="e.g. Self Help, Fiction, Programming">

    </div>
    
    <div class="mb-3">

        <label>Price</label>

        <input
        type="number"
        step="0.01"
        name="price"
        class="form-control">

    </div>

    <div class="mb-3">

        <label>Stock</label>

        <input
        type="number"
        name="stock"
        class="form-control">

    </div>

    <button class="btn btn-primary">
        Fetch & Save Book
    </button>

</form>

{% endblock %}
