{% extends 'base.html' %}

{% block content %}

<h2>Add New Book</h2>

<form method="POST">

    <div class="mb-3">

        <label>Book Title</label>

        <input
        type="text"
        name="title"
        class="form-control">

    </div>

    <div class="mb-3">

        <label>Author</label>

        <input
        type="text"
        name="author"
        class="form-control">

    </div>

    <div class="mb-3">

        <label>Category</label>

        <input
        type="text"
        name="category"
        class="form-control">

    </div>

    <div class="mb-3">

        <label>ISBN</label>

        <input
        type="text"
        name="isbn"
        class="form-control">

    </div>

    <div class="mb-3">

        <label>Price</label>

        <input
        type="number"
        step="0.01"
        name="price"
        class="form-control">

    </div>

    <div class="mb-3">

        <label>Stock</label>

        <input
        type="number"
        name="stock"
        class="form-control">

    </div>

    <button class="btn btn-primary">
        Save Book
    </button>

</form>

{% endblock %}
