{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between">

    <h2>Books List</h2>

    <a
    href="/add-book"
    class="btn btn-success">

        Add Book

    </a>

</div>

<hr>

<table class="table table-bordered">

    <tr>

        <th>ID</th>

        <th>Title</th>

        <th>Author</th>

        <th>Category</th>

        <th>Price</th>

        <th>Stock</th>

    </tr>

    {% for book in books %}

    <tr>

        <td>{{ book.id }}</td>

        <td>{{ book.title }}</td>

        <td>{{ book.author }}</td>

        <td>{{ book.category }}</td>

        <td>{{ book.price }}</td>

        <td>{{ book.stock }}</td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
